name: CI

on:
  pull_request:
    branches: [dev, demo, production]
  push:
    branches: [dev, demo, production]

env:
  REGISTRY: ghcr.io

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, test and build (${{ matrix.workspace }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  images:
    name: Build and push images
    needs: quality
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    strategy:
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Derive image tag and repository
        id: tag
        run: |
          echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          # GHCR rejects uppercase characters in image names.
          echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.tag.outputs.repo }}-${{ matrix.component }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.value }}
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref_name == 'production' }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          target: runner
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

  # GHCR only stores the images. This step records which tag the target
  # environment should run by writing it into the infrastructure repo, whose
  # own workflow performs the Helm deployment.
  bump-infra:
    name: Update image tag in infrastructure repo
    needs: images
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Map branch to environment
        id: env
        run: |
          case "${GITHUB_REF_NAME}" in
            dev)        echo "name=dev"        >> "$GITHUB_OUTPUT" ;;
            demo)       echo "name=demo"       >> "$GITHUB_OUTPUT" ;;
            production) echo "name=production" >> "$GITHUB_OUTPUT" ;;
            *) echo "Branch ${GITHUB_REF_NAME} does not map to an environment"; exit 1 ;;
          esac

      - name: Checkout infrastructure repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.INFRA_REPOSITORY }}
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Write the new image tag
        working-directory: infra
        env:
          VALUES: helm/marketplace/values-${{ steps.env.outputs.name }}.yaml
          TAG: ${{ needs.images.outputs.image_tag }}
        run: |
          yq -i ".backend.image.tag = \"${TAG}\" | .frontend.image.tag = \"${TAG}\"" "$VALUES"
          git diff --stat

      - name: Commit and push
        working-directory: infra
        env:
          TAG: ${{ needs.images.outputs.image_tag }}
          ENVIRONMENT: ${{ steps.env.outputs.name }}
        run: |
          git config user.name "marketplace-ci[bot]"
          git config user.email "marketplace-ci@users.noreply.github.com"
          if git diff --quiet; then
            echo "Image tag already up to date; nothing to deploy."
            exit 0
          fi
          git commit -am "deploy(${ENVIRONMENT}): ${TAG} from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          git push
